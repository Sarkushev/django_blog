<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>{% if object %}Редактирование статьи{% else %}Новая статья{% endif %}</title></head>
<body>
  <h1>{% if object %}Редактирование статьи{% else %}Новая статья{% endif %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
  </form>
  <a href="{% url 'blog:list' %}">Отмена</a>
</body>
</html>
